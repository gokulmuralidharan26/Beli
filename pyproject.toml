[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "beli-sync"
version = "0.1.0"
description = "Find restaurants from credit card statements and queue them for Beli"
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "python-dotenv>=1.0", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
beli-sync = "beli_sync.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
